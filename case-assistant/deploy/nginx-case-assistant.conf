# /etc/nginx/sites-available/case-assistant
# Replace __DOMAIN__ (setup-server.sh does this for you). "_" = any host.
server {
    listen 80;
    server_name __DOMAIN__;
    root /var/www/case-assistant;
    index index.html;

    # Demo protection (remove these two lines if basic auth is not wanted)
    auth_basic "Jeen.ai demo";
    auth_basic_user_file /etc/nginx/.htpasswd-case-assistant;

    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
